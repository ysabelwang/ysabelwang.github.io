---
layout: default
---
<div class="page-strip" aria-hidden="true"></div>
<main id="main" class="subpage{% if page.wide %} subpage--wide{% endif %}">
  <a class="subpage__back" href="{{ page.back_url | default: '/' }}">&larr; {{ page.back_label | default: 'Back to home' }}</a>
  {% if page.tag %}<p class="subpage__tag"><span class="tag tag--{{ page.tag_style }}">{{ page.tag }}</span></p>{% endif %}
  <h1 class="subpage__title">{{ page.title }}</h1>
{{ content }}
</main>
