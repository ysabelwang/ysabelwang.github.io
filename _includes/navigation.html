{%- comment -%} On the home page the menu links point inside the page (#about), so they scroll instead of reloading. {%- endcomment -%}
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-title" href="{% if page.home %}#top{% else %}/#top{% endif %}">{{ site.title }}</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle__bars" aria-hidden="true"></span>
      <span>Menu</span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <ul>
        {% for link in site.links %}
        <li><a href="{% if page.home %}{{ link.url | remove_first: '/' }}{% else %}{{ link.url }}{% endif %}">{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
